<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Lavagna tattica: la M di Mister è lo schema che unisce cinque giocatori.
       Tutto il disegno sta nel cerchio di sicurezza delle icone "maskable". -->
  <defs>
    <radialGradient id="prato" cx="50%" cy="38%" r="80%">
      <stop offset="0" stop-color="#1f6b45"/>
      <stop offset="0.55" stop-color="#0f3d28"/>
      <stop offset="1" stop-color="#061a11"/>
    </radialGradient>
    <linearGradient id="pedina" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#03100a" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#prato)"/>

  <!-- fasce del prato -->
  <g fill="#ffffff" opacity="0.035">
    <rect x="0" y="0" width="1024" height="146"/>
    <rect x="0" y="293" width="1024" height="146"/>
    <rect x="0" y="585" width="1024" height="146"/>
    <rect x="0" y="878" width="1024" height="146"/>
  </g>

  <!-- linee del campo -->
  <g fill="none" stroke="#ffffff" stroke-width="9" opacity="0.2">
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <circle cx="512" cy="512" r="236"/>
  </g>

  <!-- la M: schema di passaggi -->
  <g filter="url(#ombra)">
    <polyline points="300,712 300,330 512,575 724,330 724,712" fill="none" stroke="#ffffff" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="url(#pedina)" stroke="#ffffff" stroke-width="20">
      <circle cx="300" cy="712" r="58"/>
      <circle cx="300" cy="330" r="58"/>
      <circle cx="724" cy="330" r="58"/>
      <circle cx="724" cy="712" r="58"/>
    </g>
    <circle cx="512" cy="575" r="58" fill="#ffffff"/>
    <circle cx="512" cy="575" r="24" fill="#0f3d28"/>
  </g>
</svg>
